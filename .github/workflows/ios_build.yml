name: iOS Build (unsigned – Sideloadly)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # hmb_core is a separate private repo, consumed as a sibling path
      # dependency (pubspec.yaml: `hmb_core: { path: ../hmb_core }`) — same
      # layout as local dev and as ci.yml. Pinned to a tag, not a branch, so
      # release builds use a known-stable hmb_core rather than whatever main
      # happens to contain at build time.
      #
      # actions/checkout's `path` input refuses to place a repo outside the
      # primary checkout directory (path-traversal guard on `../hmb_core`),
      # so this is a plain `git clone` straight into the sibling location
      # instead. The PAT in the URL is never printed — Actions masks any
      # string matching a registered secret in logs.
      - name: Checkout hmb_core
        env:
          HMB_CORE_PAT: ${{ secrets.HMB_CORE_PAT }}
        run: |
          git clone --branch v1.0.0 --depth 1 \
            https://x-access-token:${HMB_CORE_PAT}@github.com/IO986/hmb_core.git \
            ../hmb_core

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate l10n
        run: flutter gen-l10n

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update

      - name: Build iOS (no code sign)
        run: flutter build ios --release --no-codesign

      - name: Get version from pubspec
        id: version
        run: echo "version=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)" >> $GITHUB_OUTPUT

      - name: Package as IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r "HMB-Sailing-Log-v${{ steps.version.outputs.version }}.ipa" Payload/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: HMB-Sailing-Log-v${{ steps.version.outputs.version }}-iOS
          path: "*.ipa"
          retention-days: 30
